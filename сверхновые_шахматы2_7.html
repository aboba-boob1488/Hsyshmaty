<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахматы со своими фигурами</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&display=swap">
<style>
:root{color-scheme:light;--bg:#eaf0f3;--fg:#15232d;--card:#fff;--l:#d9e4e8;--d:#7d9aa8;--sel:#f2a33a;--go:#1f7a5c;--acc:#2f5d8a;--line:#c4d2d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#10181f;--fg:#e4ecf0;--card:#1a252e;--l:#aebfc7;--d:#55707e;--sel:#f5b54a;--go:#4fd1a3;--acc:#4f86bd;--line:#2c3a45}}
:root[data-theme=dark]{color-scheme:dark;--bg:#10181f;--fg:#e4ecf0;--card:#1a252e;--l:#aebfc7;--d:#55707e;--sel:#f5b54a;--go:#4fd1a3;--acc:#4f86bd;--line:#2c3a45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.45 Manrope,system-ui,sans-serif}
main{max-width:520px;margin:auto;padding:14px 12px 28px}
h1{font-size:22px;font-weight:800;margin:4px 0 12px}
[hidden]{display:none!important}
button,.btn{font:inherit;font-size:15px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
#tabs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:nowrap}
#tabs button{flex:1;border:none;background:transparent;color:var(--fg);padding:8px 4px;font-weight:800;border-radius:10px;font-size:22px;line-height:1}
#tabs button.on{background:var(--acc);color:#fff}
.chip{border-radius:999px;padding:5px 12px;font-size:14px}
#st{margin:8px 0;font-weight:800}
#bd{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:min(100%,480px);aspect-ratio:1;margin:auto;border-radius:8px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#bd.ed{touch-action:none}
.sq{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;font-weight:400}
.sq *{pointer-events:none}
.l{background:var(--l)}.d{background:var(--d)}
.sq em{position:absolute;font:800 10px/1 Manrope,sans-serif;font-style:normal}
.fl{left:3px;bottom:2px}.rk{right:3px;top:2px}
.l em{color:var(--d)}.d em{color:var(--l)}
.lm{background-image:linear-gradient(rgba(240,200,30,.5),rgba(240,200,30,.5))}
.chk{background-image:radial-gradient(circle,#ff2a2a 0%,rgba(230,20,20,.7) 40%,rgba(230,20,20,0) 75%)}
.sel{box-shadow:inset 0 0 0 4px var(--sel)}
.go::after{content:"";position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:var(--go);opacity:.85}
.cap{box-shadow:inset 0 0 0 4px var(--go)}
.pc{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-style:normal}
.pc img{width:94%;height:94%;image-rendering:pixelated}
#bd.duo .pc.b img,#bd.duo .pc.g img,#bd.duo .pc.r img{transform:rotate(180deg)}
.pc{position:relative}
/* цвет сторон r/g/y рисуется в спрайте только по непрозрачным пикселям */
.sq.fogged{
  background-image:
    radial-gradient(ellipse at 50% 40%, rgba(30,42,58,.2) 0%, rgba(6,10,16,.78) 70%, rgba(4,8,12,.88) 100%),
    repeating-linear-gradient(-18deg, transparent 0 5px, rgba(255,255,255,.035) 5px 6px)!important;
  box-shadow:inset 0 0 18px rgba(0,0,0,.35);
}
.sq.fogged .pc{visibility:hidden}
.sq.fogged::before{
  content:"";position:absolute;inset:14%;border-radius:5px;
  background:rgba(18,26,36,.35);
  border:1px solid rgba(160,190,220,.12);
  box-shadow:inset 0 0 10px rgba(0,0,0,.35);
}
.sq{position:relative}
.sq.ducksq{box-shadow:inset 0 0 0 2px #f5c542;z-index:1}
.duck{font-size:clamp(14px,4.5vw,22px);line-height:1;position:relative;z-index:4;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));pointer-events:none}
.sq.duck-target{cursor:pointer}
.sq.duck-target::after{
 content:"";position:absolute;width:24%;aspect-ratio:1;border-radius:50%;
 background:#f5c542;opacity:.8;z-index:3;box-shadow:0 0 0 2px rgba(0,0,0,.2);
}
.sq.fogged.duck-target::after{opacity:.95}
.sq.fogged .duck{visibility:visible;z-index:4}
.cap:empty,.cap:not(:has(*)){display:none;min-height:0;padding:0}
.cap{min-height:0}
.sq.portal-bg::before{
 content:"";position:absolute;inset:10%;border-radius:50%;
 background:
  radial-gradient(circle at 35% 30%,rgba(180,220,255,.85) 0%,rgba(80,140,255,.35) 35%,rgba(40,60,180,.55) 70%,transparent 72%),
  conic-gradient(from 0deg,rgba(100,180,255,.5),rgba(60,100,220,.2),rgba(140,200,255,.55),rgba(60,100,220,.2),rgba(100,180,255,.5));
 box-shadow:0 0 10px rgba(80,140,255,.45),inset 0 0 8px rgba(200,230,255,.35);
 z-index:0;pointer-events:none;opacity:.9;
}
.sq.crystal-bg::before{
 content:"";position:absolute;inset:12%;
 background:
  linear-gradient(135deg,transparent 40%,rgba(200,240,255,.35) 50%,transparent 60%),
  linear-gradient(45deg,rgba(120,220,255,.15),rgba(180,100,255,.25));
 clip-path:polygon(50% 0%,80% 35%,65% 100%,35% 100%,20% 35%);
 box-shadow:0 0 12px rgba(140,200,255,.5);
 z-index:0;pointer-events:none;
}
.sq .pc{position:relative;z-index:1}
.sq.go::after{content:"";position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:var(--go);opacity:.85;z-index:2}
.sq.go-free::after{content:"";position:absolute;width:28%;aspect-ratio:1;border-radius:2px;background:#e67e22;opacity:.9;transform:rotate(45deg);z-index:2;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.sq.cap-free{box-shadow:inset 0 0 0 4px #e67e22}
.hand{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.hand button{padding:4px 8px;min-width:0}
.hand .on{outline:2px solid var(--sel)}
.sq.fogged.fog-edge{
  background-image:
    radial-gradient(ellipse at 50% 50%, rgba(40,55,75,.15) 0%, rgba(10,16,24,.55) 100%)!important;
}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin:10px 0}
.pal{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px}
.pal .pc,.li .pc{width:44px;height:44px}
.li{display:flex;align-items:center;gap:8px;margin:8px 0}.li span{flex:1;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:min(100%,360px);margin:10px auto}
.gc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:6px;font-weight:800;cursor:pointer}
.gc.on{background:var(--acc);border-color:var(--acc);color:#fff}
.gc.c{background:var(--d);cursor:default}
.px{grid-template-columns:repeat(16,1fr);gap:0;width:min(100%,336px);touch-action:none;user-select:none;-webkit-user-select:none;background:var(--l);border:1px solid var(--line)}
.pxc{aspect-ratio:1;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.3)}
.sw{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;background:var(--card)}
.sw.s{outline:3px solid var(--sel)}
.bp{width:38px;height:38px;padding:0}
input[type=text],select,textarea{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);max-width:100%;box-sizing:border-box}
label{display:block;margin:10px 0}
select{width:100%;margin:4px 0}
.hint,small{opacity:.75;font-size:13px}
.cap{min-height:0;display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:2px 6px}
.cp{width:24px;height:24px;display:inline-block}.cp .pc{width:100%;height:100%}.cp.rot .pc img{transform:rotate(180deg)}
.nv button{flex:1;min-width:0;font-size:18px;padding:8px 0}
button:disabled{opacity:.4;cursor:default}
#bd{position:relative}
.endov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,20,.55);color:#fff;text-align:center;padding:12px;font-size:20px;border-radius:8px}
.endov button{background:var(--acc);color:#fff;border:none;font-size:16px;padding:10px 16px;border-radius:10px}
.fogov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,12,18,.88);color:#fff;text-align:center;padding:16px;font-size:18px;border-radius:8px;z-index:5}
.fogov button{background:var(--acc);color:#fff;border:none;font-size:16px;padding:12px 20px;border-radius:12px;min-width:160px}

.sq.spec{box-shadow:inset 0 0 0 2px var(--sel)}
.sq.spec em.sp{position:absolute;font-size:11px;top:2px;left:2px;opacity:.9}
.mode-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--card)}
.mode-card h4{margin:0 0 4px;font-size:15px}
.mode-card p{margin:0;font-size:13px;opacity:.85}
.board-list{max-height:280px;overflow:auto}
.pack-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.ic{font-size:16px;padding:8px 0}
.nv button.apply{flex:2.2;font-size:15px;white-space:nowrap;padding:8px 6px}
/* анализ партии */
#an{display:none;margin:4px 0 8px}
#an.on{display:block}
#an .ag{width:100%;height:110px;background:var(--card);border:1px solid var(--line);border-radius:10px;touch-action:none;display:block}
#an .ml{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:6px 0;font-size:14px}
#an .ml b{display:flex;gap:6px;align-items:center;padding:4px 8px;cursor:pointer;border-bottom:1px solid var(--line)}
#an .ml b:hover,#an .ml b.on{background:rgba(47,93,138,.15)}
#an .ml .tag{font-weight:800;min-width:2.4em;text-align:center;border-radius:4px;padding:1px 4px;font-size:12px}
.tag-!!{background:#1a9e5c;color:#fff}.tag-!{background:#2d8a5a;color:#fff}.tag-g{background:#5a8a6a;color:#fff}
.tag-?!{background:#c9a227;color:#111}.tag-?{background:#c45;color:#fff}.tag-??{background:#a22;color:#fff}
#an .stat{font-size:13px;opacity:.9;line-height:1.4;margin:4px 0}
#an .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
#an .prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .12s}
#an .row{margin:4px 0}
#capB{margin-bottom:0}
#nav{margin-top:4px}
#chatbox{margin-top:12px}
#chatlog{max-height:220px;min-height:40px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.bb{max-width:85%;padding:6px 10px;border-radius:12px;background:var(--l);color:#15232d;font-size:14px;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.bb.me{align-self:flex-end;background:var(--acc);color:#fff}
input[type=password]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);max-width:100%;box-sizing:border-box}
</style>

function chess960(){
 const b=empty();
 const back=['r','n','b','q','k','b','n','r'];
 // simple shuffle keeping bishops opposite colors and king between rooks (simplified)
 const pos=[0,1,2,3,4,5,6,7];
 for(let i=pos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pos[i],pos[j]]=[pos[j],pos[i]]}
 const T=pos.map(i=>back[i]);
 // ensure king has rooks on both sides (basic)
 let ki=T.indexOf('k'),ri=T.indexOf('r'),rj=T.lastIndexOf('r');
 if(ri>ki||rj<ki){T[ki]='r';T[4]='k';} // fallback
 for(let c=0;c<8;c++){b[0][c]={t:T[c],c:'b'};b[1][c]={t:'p',c:'b'};b[6][c]={t:'p',c:'w'};b[7][c]={t:T[c],c:'w'}}
 return b;
}
function hordeSetup(){
 const b=empty();
 const T='rnbqkbnr';
 for(let c=0;c<8;c++){b[0][c]={t:T[c],c:'b'};b[1][c]={t:'p',c:'b'}}
 for(let r=4;r<=7;r++)for(let c=0;c<8;c++)if(!(r===4&&(c===0||c===7)))b[r][c]={t:'p',c:'w'};
 return b;
}
function racingSetup(){
 const b=empty();
 // kings and some pieces on back, no pawns mostly
 b[7][4]={t:'k',c:'w'};b[0][4]={t:'k',c:'b'};
 for(const [r,c,t,col] of [[7,0,'r','w'],[7,7,'r','w'],[0,0,'r','b'],[0,7,'r','b'],[7,1,'n','w'],[7,6,'n','w'],[0,1,'n','b'],[0,6,'n','b']])b[r][c]={t,c:col};
 return b;
}
function pawnOnlySetup(){
 const b=empty();
 for(let c=0;c<8;c++){b[1][c]={t:'p',c:'b'};b[6][c]={t:'p',c:'w'}}

}
function visibilityFor(col){
 const H=BH(),W=BW();
 const vis=Array.from({length:H},()=>Array(W).fill(0));
 const r=Math.max(1,S.fog.radius|0);
 B.forEach((row,rr)=>row.forEach((p,cc)=>{
  if(!p||p.c!==col)return;
  if(S.fog.around)for(let dr=-r;dr<=r;dr++)for(let dc=-r;dc<=r;dc++){
   const i=rr+dr,k=cc+dc;if(i>=0&&i<H&&k>=0&&k<W)vis[i][k]=1;
  }
  if(S.fog.lines||S.fog.diag){
   const dirs=[];
   if(S.fog.lines)dirs.push(...O);
   if(S.fog.diag)dirs.push(...D);
   for(const[dx,dy]of dirs){
    for(let j=1;j<=r;j++){
     const i=rr+dy*j,k=cc+dx*j;
     if(i<0||i>=H||k<0||k>=W)break;
     vis[i][k]=1;
     if(B[i][k])break;
    }
   }
  }
 }));
 return vis;
}
function getFogViewer(){

 if(S.fog.pass)return turn;
 const pl=playersList();
 const humans=pl.filter(c=>(S.ctl[c]||'h')==='h');
 /* один человек против ботов — всегда его обзор; иначе горячее кресло по ходу */

}
function isVisible(r,c,viewer){
 if(!S.fog.on||!viewer)return true;
 if(fogged)return false;
 const vis=visibilityFor(viewer);
 return !!(vis[r]&&vis[r][c]);
}
/* Доска «глазами» стороны: чужие фигуры вне обзора скрыты (для оценки и ИИ) */
function fogViewBoard(X,viewer){
 if(!S.fog.on||!viewer)return X;
 const vis=visibilityFor(viewer);
 return X.map((row,r)=>row.map((p,c)=>{
  if(!p)return null;
  if(p.c===viewer)return p;
  if(vis[r]&&vis[r][c])return p;
  return null;
 }));
}
function captureValueSeen(X,r,c,viewer){

 if(!q)return 0;
 if(S.fog.on&&viewer&&q.c!==viewer&&!isVisible(r,c,viewer))return 0; /* не знаем, что там */
 return P[q.t]?P[q.t].val||0:0;
}

 bits.push(r.check?'шах/мат':'без шаха');

function portalPair(r,c){
 const sp=(specials||[]).find(s=>s.type==='portal'&&s.r===r&&s.c===c);
 if(!sp)return null;
 return (specials||[]).find(s=>s.type==='portal'&&s.pair===sp.pair&&!(s.r===r&&s.c===c))||null;
}
function applyPortal(X,r,c){
 if(!(S.rules.portals||(specials||[]).some(s=>s.type==='portal')))return '';
 const other=portalPair(r,c);
 if(!other)return '';
 if(X[other.r][other.c])return ''; /* занят — не телепорт */
 if(S.rules.duck&&duck&&duck.r===other.r&&duck.c===other.c)return '';
 const p=X[r][c];if(!p)return '';
 X[other.r][other.c]=p;X[r][c]=null;
 return 'Портал → '+sqName(other.r,other.c);
}
function applyIceSlide(X,fr,fc,tr,tc){
 if(!S.rules.ice)return {r:tr,c:tc,note:''};
 const dr=Math.sign(tr-fr),dc=Math.sign(tc-fc);
 if(!dr&&!dc)return {r:tr,c:tc,note:''};
 /* скользим только если ход был ровно в одном направлении (не конь) */
 if(dr&&dc&&Math.abs(tr-fr)!==Math.abs(tc-fc))return {r:tr,c:tc,note:''};
 if(Math.abs(tr-fr)>1&&Math.abs(tc-fc)>1&&Math.abs(tr-fr)!==Math.abs(tc-fc))return {r:tr,c:tc,note:''};
 /* конь: |dr|,|dc| = 1,2 */
 if((Math.abs(tr-fr)===1&&Math.abs(tc-fc)===2)||(Math.abs(tr-fr)===2&&Math.abs(tc-fc)===1))return {r:tr,c:tc,note:''};
 let r=tr,c=tc,H=X.length,W=X[0].length,slid=0;
 while(true){
  const nr=r+dr,nc=c+dc;
  if(nr<0||nr>=H||nc<0||nc>=W)break;
  if(S.rules.duck&&duck&&duck.r===nr&&duck.c===nc)break;
  if(X[nr][nc])break;
  /* не проскакиваем через портал без остановки — останавливаемся на портале */
  r=nr;c=nc;slid++;
  if(portalPair(r,c))break;
 }
 if(slid&&(r!==tr||c!==tc)){
  const p=X[tr][tc];X[r][c]=p;X[tr][tc]=null;
  return {r,c,note:'Скольжение → '+sqName(r,c)};
 }
 return {r:tr,c:tc,note:''};
}
function ensureCrystal(){

 specials.push({r:(H/2)|0,c:(W/2)|0,type:'crystal',sym:'💎'});
}
function placePortalPair(r1,c1,r2,c2){
 const pair='p'+Date.now().toString(36);
 const cols=['🔵','🟣','🟠','🟢','🔴'];

 specials=(specials||[]).filter(s=>!(s.type==='portal'&&((s.r===r1&&s.c===c1)||(s.r===r2&&s.c===c2))));
 specials.push({r:r1,c:c1,type:'portal',pair,sym});
 specials.push({r:r2,c:c2,type:'portal',pair,sym});
}

/* правила */
function legal(r,c,X=B,att){
 const H=BH(),W=BW();
 const p=X[r][c],d=P[p.t],s=(p.c==='b'||p.c==='g')?-1:1,o=[];
 const isDuck=(i,k)=>S.rules.duck&&duck&&duck.r===i&&duck.c===k;
 const walk=(L,md)=>{for(const[dx,dy,n]of L){
  const g=gcd(Math.abs(dx),Math.abs(dy)),ux=dx/g,ur=-dy*s/g;
  for(let j=1;j<=(n?n*g:Math.max(H,W));j++){
   const i=r+ur*j,k=c+ux*j;
   if(i<0||i>=H||k<0||k>=W)break;
   if(isDuck(i,k))break; /* утка блокирует, взять нельзя */
   const q=X[i][k];
   if(j%g){if(q&&!d.jump)break;continue}
   if(!q){if(md!=2||(d.pw&&ep&&ep.c!=p.c&&ep.sq[0]==i&&ep.sq[1]==k))o.push([i,k])}
   else{if(q.c!=p.c&&md!=1&&(att||!P[q.t].royal))o.push([i,k]);if(!d.jump)break}
  }}};
 d.cm?(walk(d.m,1),walk(d.cm,2)):walk(d.m,0);
 if(d.pw&&!p.m&&!S.rules.noPawnDouble&&d.m.some(a=>!a[0]&&a[1]==1)){const f=r-s,f2=r-2*s;if(X[f]&&!X[f][c]&&!isDuck(f,c)&&X[f2]&&!X[f2][c]&&!isDuck(f2,c))o.push([f2,c])}
 if(d.ability=='teleport'){for(let i=0;i<H;i++)for(let k=0;k<W;k++){if(isDuck(i,k))continue;const q=X[i][k];if((!q||q.c!=p.c)&&(att||!q||!P[q.t].royal)&&!(i==r&&k==c))o.push([i,k])}}
 return o}
const inCheck=(X,col)=>{if(!S.rules.check)return false;const W=BW();const ks=[];X.forEach((row,r)=>row.forEach((p,c)=>p&&p.c==col&&P[p.t].royal&&ks.push(r*W+c)));if(!ks.length&&!S.rules.multiKing)return false;return ks.length&&X.some((row,r)=>row.some((p,c)=>p&&p.c!=col&&legal(r,c,X,1).some(m=>ks.includes(m[0]*W+m[1]))))};
function castle(r,c){const p=B[r][c],o=[],H=BH(),W=BW();
 const home=p.c==='b'||p.c==='g'?0:H-1;
 const kingFile=W===8?4:Math.floor((W-1)/2);
 if(!S.rules.castle||p.t!='k'||p.m||c!=kingFile||r!=home||inCheck(B,p.c))return o;
 for(const d of[1,-1]){const rc=d>0?W-1:0,rk=B[r][rc];
  if(!rk||rk.t!='r'||rk.c!=p.c||rk.m)continue;
  let ok=1;for(let x=c+d;x!=rc;x+=d)if(B[r][x])ok=0;
  for(const x of[c+d,c+2*d]){if(x<0||x>=W){ok=0;break}const X=clone(B);X[r][x]=X[r][c];X[r][c]=null;if(inCheck(X,p.c))ok=0}
  if(ok)o.push([r,c+2*d])}
 return o}
function fire(X,r,c,cap){
 const p=X[r][c],d=P[p.t],e=d.ev;if(!e||!e.when)return'';
 const w=e.when;if(!(w=='far'?((p.c==='b'||p.c==='g')?r===BH()-1:r===0):w=='edge'?r===0||r===BH()-1||c===0||c===BW()-1:cap))return'';
 const nt=d.name+' '+{to:'превращается',pick:'превращается',die:'исчезает',boom:'взрывается'}[e.do];
 if(e.do=='to')p.t=P[e.to]?e.to:'q';
 else if(e.do=='pick'){if(X===B)pend=[r,c]}
 else if(e.do=='die')X[r][c]=null;
 else for(let i=r-1;i<=r+1;i++)for(let j=c-1;j<=c+1;j++)if(X[i]&&X[i][j]&&!P[X[i][j].t].royal)X[i][j]=null;
 return nt}
const mvApply=(X,a,b,r,c)=>{const p=X[a][b];let cap=!!X[r][c];
 if(p.pw&&!cap&&ep&&ep.sq[0]==r&&ep.sq[1]==c&&ep.c!=p.c){X[ep.pr][ep.pc]=null;cap=true}
 X[r][c]=p;X[a][b]=null;p.m=1;
 if(p.t=='k'&&a==r&&Math.abs(c-b)==2){const rc=c>b?7:0,k=X[r][rc];X[r][(b+c)/2]=k;X[r][rc]=null;if(k)k.m=1}
 return fire(X,r,c,cap)};
const safe=(r,c)=>[...legal(r,c),...castle(r,c)].filter(([i,k])=>{const X=clone(B);mvApply(X,r,c,i,k);return!inCheck(X,B[r][c].c)});
function status(){
 if(S.rules.win==='checks'){

  }

  for(const r of[Math.floor((H-1)/2),Math.ceil((H-1)/2)])for(const c of[Math.floor((W-1)/2),Math.ceil((W-1)/2)])centers.push([r,c]);
  for(const[r,c]of centers){const p=B[r]&&B[r][c];if(p&&P[p.t].royal){over='Царь холма! Победили '+colName(p.c).toLowerCase();return}}
 }

 }
 if(!B.some((row,r)=>row.some((p,c)=>p&&p.c==turn&&safe(r,c).length))){

}

   });

}
const cnt=X=>{const m={};X.forEach(row=>row.forEach(q=>{if(q){const k=q.c+q.t;m[k]=(m[k]||0)+1}}));return m};
function capDiff(before,t0,mc,p){

 for(const k in before){
  let d=before[k]-(after[k]||0);
  if(k==mc+t0&&p.t!=t0)d-=1;
  for(let i=0;i<d;i++){
   const fromCol=k[0], t=k.slice(1);
   if(S.rules.crazy){
    /* Crazyhouse: взятая фигура уходит в руку бьющего (свой цвет), не король */
    if(t!=='k'&&!P[t]?.royal){if(!CAPT[mc])CAPT[mc]=[];CAPT[mc].push({t,c:mc})}
   }else{
    if(!CAPT[fromCol])CAPT[fromCol]=[];CAPT[fromCol].push({t,c:fromCol});
   }
  }

}

function doDrop(r,c){

 if(idx<0)return;

function makeAISprite(motif){
 const rows=[0,0,2,4,6,7,8,8,8,8,8,7,6,5,0,0],g=Array(256).fill('.');
 const put=(x,y,ch)=>{if(x>=0&&x<16&&y>=0&&y<16)g[y*16+x]=ch};
 for(let y=2;y<=13;y++){const w=rows[y],left=8-w;for(let x=left;x<=8+w;x++){put(x,y,'2');if(x==left||x==8+w)put(x,y,'0')}}
 // голова и детали силуэта
 for(let y=1;y<=5;y++)for(let x=5;x<=10;x++)put(x,y,(x==5||x==10||y==1)?'0':'2');
 for(let x=4;x<=5;x++)put(x,2,'0');for(let x=10;x<=11;x++)put(x,2,'0');
 for(let x=5;x<=6;x++)put(x,4,'3');for(let x=9;x<=10;x++)put(x,4,'3');
 for(let y=11;y<=14;y++){put(5,y,'0');put(6,y,'2');put(9,y,'0');put(10,y,'2')}
 if(motif=='stripes'){for(let y=3;y<12;y+=2)for(let x=3+(y%3);x<13;x+=3)put(x,y,'3')}
 else if(motif=='spots'){[[4,7],[11,8],[6,10],[10,5],[3,9],[12,6]].forEach(([x,y])=>put(x,y,'3'))}
 else if(motif=='flame'){for(let y=2;y<7;y++)for(let x=6;x<10;x++)if((x+y)%3==0)put(x,y,'3')}
 else if(motif=='crystal'){for(let y=0;y<5;y++)for(let x=5;x<11;x++)if(Math.abs(x-8)<=y+1)put(x,y,'3')}
 else if(motif=='crown'){for(let x=4;x<=11;x++)put(x,1,'3');[4,6,9,11].forEach(x=>put(x,0,'3'))}
 else if(motif=='robot'){for(let x=6;x<=9;x++)put(x,3,'3');put(6,4,'3');put(9,4,'3')}
 else if(motif=='wing'){for(let y=4;y<9;y++){put(2+y%2,y,'3');put(13-y%2,y,'3')}}
 const white=g.join(''),black=[...white].map(c=>c=='2'?'5':c=='3'?'6':c=='1'?'4':c).join('');
 return{sw:white,sb:black};
}
async function generateAIPiece(){
 const btn=document.querySelector('[data-a="genpiece"]'),status=$('#pieceGenStatus'),prompt=($('#piecePrompt')?.value||'').trim();
 if(!E||!prompt){if(status)status.textContent='Сначала опиши фигуру.';return}
 if(!S.ai.url||!S.ai.model){if(status)status.textContent='Сначала укажи адрес API и модель в настройках нейросети.';return}
 if(btn)btn.disabled=true;if(status)status.textContent='Нейросеть придумывает правила и пиксельный рисунок…';
 try{
  const sys=`Ты генератор новых фигур для шахматной игры. Верни только JSON без markdown: {"name":"до 20 символов","description":"коротко","moves":[[dx,dy,range]],"captureMoves":null или массив таких же ходов,"ability":"none|jump|teleport|explode|promotion|royal","value":0..15,"motif":"stripes|spots|flame|crystal|crown|robot|wing|plain"}. dx,dy целые от -3 до 3, не оба ноль. range=1 означает ход на одну клетку; range=0 означает ход по лучу до препятствия. dy положительный означает вперёд. Не выдавай программный код. Способности: jump — проходить через фигуры; teleport — особое перемещение; explode — при взятии взрыв вокруг; promotion — превращение на дальнем краю; royal — королевская фигура. Выбирай только одну поддерживаемую способность. Не придумывай несуществующие способности. Для обычной фигуры предложи 1–8 осмысленных ходов.`;
  const txt=await aiPost([{role:'system',content:sys},{role:'user',content:prompt}],{timeout:S.ai.timeout||60000,jsonMode:true});
  if(!txt)throw new Error(AI_LAST_ERROR||'Нейросеть не вернула ответ');
  const d=parseJ(txt);if(!d||!Array.isArray(d.moves))throw new Error('Ответ пришёл, но правила фигуры не распознаны. Нажми генерацию ещё раз.');
  const normalize=list=>(Array.isArray(list)?list:[]).slice(0,30).map(m=>{if(!Array.isArray(m)||m.length<2)return null;let dx=Math.max(-3,Math.min(3,Math.trunc(+m[0]))),dy=Math.max(-3,Math.min(3,Math.trunc(+m[1])));if(!Number.isFinite(dx)||!Number.isFinite(dy)||(!dx&&!dy))return null;return[dx,dy,+m[2]===0?0:1]}).filter(Boolean);
  const moves=normalize(d.moves);if(!moves.length)throw new Error('Нейросеть не предложила допустимые перемещения.');
  const caps=normalize(d.captureMoves);
  E.name=String(d.name||'Новая фигура').replace(/[<>]/g,'').slice(0,20)||'Новая фигура';
  E.g=fromM(moves);E.h=fromM(caps);E.sep=caps.length?1:0;
  E.jump=d.ability==='jump'?1:0;E.ability=d.ability==='teleport'?'teleport':'none';
  E.royal=d.ability==='royal'?1:0;E.pw=0;
  if(d.ability==='explode'){E.when='cap';E.do='boom'}
  else if(d.ability==='promotion'){E.when='far';E.do='pick'}
  else{E.when='';E.do='to'}
  E.val=Math.max(0,Math.min(15,Math.round(+d.value||1)));
  const art=makeAISprite(['stripes','spots','flame','crystal','crown','robot','wing'].includes(d.motif)?d.motif:'plain');
  E.sw=art.sw;E.sb=art.sb;E.es='w';E.col='0';E.sy=0;E.tl='pen';
  fill();if(status)status.textContent='Фигура создана! Проверь ходы и способность, затем нажми «Сохранить». '+String(d.description||'').slice(0,180);
 }catch(err){if(status)status.textContent='Не удалось создать фигуру: '+String(err.message||err).slice(0,240)}
 finally{if(btn)btn.disabled=false}
}

function evaluatePosition(X,me,viewer){

  }

function search(X,col,d,al,be,ply,rootCol){

  ep=epOf(X[a][b],a,r,c);

  if(v>best)best=v;if(best>al)al=best;if(al>=be)break}

function boardImageDataUrl(){

  const light=S.l||'#f0d9b5',dark=S.d||'#b58863';

    x.fillStyle='#f5c542';x.beginPath();x.arc(pad+c*cell+cell/2,pad+r*cell+cell/2,6,0,Math.PI*2);x.fill();
   }
  }
  x.fillStyle='#9ab';x.font='11px monospace';
  for(let c=0;c<W;c++)x.fillText(COLS_LETTERS[c]||'',pad+c*cell+cell/2,pad+H*cell+10);

 }catch(e){return null}

function netBroadcast(msg,except){
 NET.conns.forEach(c=>{
  if(!c.conn||!c.conn.open)return;
  if(except&&c.peerId===except)return;
  try{c.conn.send(msg)}catch(e){}
 });
}
function netSendState(){
 const msg={
  type:'state',
  pack:pack(),
  seats:NET.seats,
  lobby:NET.lobby,
  hostId:netIsHost()?netMyId():undefined
 };
 if(netIsHost())netBroadcast(msg);
 else{
  const host=NET.conns[0];
  if(host&&host.conn&&host.conn.open)try{host.conn.send(msg)}catch(e){}
 }
}
function netApplySeatsToCtl(){
 const pl=playersList();
 S.ctl={};
 pl.forEach(c=>{
  const s=NET.seats[c];
  if(s&&s.peerId===netMyId())S.ctl[c]='h';
  else if(s)S.ctl[c]='net';
  else S.ctl[c]='s'; /* свободное место — сильный бот, чтобы партия не зависала */
 });
}
function netApply(msg,fromPeerId){
 if(!msg||typeof msg!=='object')return;
 if(msg.type==='hello'){
  /* гость представился */
  const row=NET.conns.find(c=>c.peerId===fromPeerId);
  if(row){row.name=msg.name||'Игрок';row.color=msg.color||null}
  if(msg.color&&playersList().includes(msg.color)){
   if(!NET.seats[msg.color]||NET.seats[msg.color].peerId===fromPeerId)
    NET.seats[msg.color]={peerId:fromPeerId,name:msg.name||'Игрок'};
  }
  if(netIsHost()){netBroadcast({type:'lobby',seats:NET.seats,lobby:NET.lobby,room:NET.room});netSendState()}
  render();return;
 }
 if(msg.type==='lobby'){
  NET.seats=msg.seats||NET.seats;
  if(msg.lobby!=null)NET.lobby=msg.lobby;
  netApplySeatsToCtl();
  render();return;
 }
 if(msg.type==='claim'){
  if(!netIsHost())return;
  const col=msg.color,pid=fromPeerId;
  if(!playersList().includes(col))return;
  /* освободить прошлый цвет этого игрока */
  Object.keys(NET.seats).forEach(k=>{if(NET.seats[k]&&NET.seats[k].peerId===pid)delete NET.seats[k]});
  if(NET.seats[col]&&NET.seats[col].peerId!==pid){
   /* занято */ 
   const row=NET.conns.find(c=>c.peerId===pid);
   if(row&&row.conn)try{row.conn.send({type:'chat',text:'Место '+colName(col)+' занято',sys:1})}catch(e){}
   return;
  }
  NET.seats[col]={peerId:pid,name:msg.name||'Игрок'};
  netBroadcast({type:'lobby',seats:NET.seats,lobby:NET.lobby});
  render();return;
 }
 if(msg.type==='start'){
  NET.lobby=0;
  if(msg.pack)try{unpack(msg.pack)}catch(e){}
  NET.seats=msg.seats||NET.seats;
  netApplySeatsToCtl();
  NET.status='Игра началась';
  render();return;
 }
 if(msg.type==='state'&&msg.pack){
  try{
   const seats=msg.seats||NET.seats;
   const lobby=msg.lobby!=null?msg.lobby:NET.lobby;
   unpack(msg.pack);
   NET.seats=seats;NET.lobby=lobby;
   netApplySeatsToCtl();
   NET.status=(NET.lobby?'Лобби':'Игра')+' · ход '+colName(turn);
   render();
   /* хост ретранслирует гостям */
   if(netIsHost()&&fromPeerId)netBroadcast(msg,fromPeerId);
  }catch(e){NET.status='Ошибка синхронизации'}
  return;
 }
 if(msg.type==='chat'&&msg.text){
  const line={who:msg.sys?'sys':(msg.peerId===netMyId()?'me':'peer'),name:msg.name||'',text:String(msg.text).slice(0,300)};
  NET.chat.push(line);if(NET.chat.length>80)NET.chat.shift();
  render();
  if(netIsHost()&&fromPeerId)netBroadcast({...msg,peerId:fromPeerId},fromPeerId);
  return;
 }
}
function netBind(conn,asHost){
 const peerId=conn.peer;
 const row={conn,peerId,name:'Игрок',color:null};
 NET.conns=NET.conns.filter(c=>c.peerId!==peerId);
 NET.conns.push(row);
 conn.on('data',d=>netApply(d,peerId));
 conn.on('close',()=>{
  NET.conns=NET.conns.filter(c=>c.peerId!==peerId);
  Object.keys(NET.seats).forEach(k=>{if(NET.seats[k]&&NET.seats[k].peerId===peerId)delete NET.seats[k]});
  NET.status='Игрок отключился';
  if(netIsHost())netBroadcast({type:'lobby',seats:NET.seats,lobby:NET.lobby});
  render();
 });
 conn.on('error',e=>{NET.status='Ошибка канала: '+(e&&e.type||e);render()});
 if(asHost){
  NET.status='Игрок подключился ('+NET.conns.length+')';
  conn.send({type:'lobby',seats:NET.seats,lobby:NET.lobby,room:NET.room});
  setTimeout(()=>netSendState(),300);
 }else{
  NET.status='На связи с хостом';
  conn.send({type:'hello',name:NET.myName,color:NET.myColor});
 }
 render();
}
function netCreatePeer(serverIdx,onReady){
 if(typeof Peer==='undefined'){NET.status='PeerJS не в файле';render();return}
 if(NET.peer){try{NET.peer.destroy()}catch(e){}NET.peer=null}
 const srv=PEER_SERVERS[serverIdx]||{};
 NET.status='Подключение к серверу '+(srv.host||'default')+'…';render();
 let p;
 try{p=new Peer(peerConfig(srv))}catch(e){NET.status='Не удалось создать Peer: '+e;render();return}
 NET.peer=p;
 const fail=e=>{
  const t=(e&&e.type)||String(e);
  NET.status='Peer error: '+t;
  if(serverIdx+1<PEER_SERVERS.length){
   NET.status+=' — пробую другой сервер…';
   setTimeout(()=>netCreatePeer(serverIdx+1,onReady),500);
  }else{
   NET.status='Все сигнальные серверы недоступны (VPN/WebView/сеть). Используй «Получить ссылку» или отключи VPN.';
   render();
  }
 };
 p.on('error',fail);
 p.on('open',id=>{NET.room=id;NET.status='Комната готова';onReady&&onReady(id);render()});
}
function netHost(){

function netJoin(code){

 });

function botMove(){
 if(over||pend||S.paused||S.ctl[turn]=='h')return;
 if(duckPend){
  const H=BH(),W=BW(),opts=[];
  for(let i=0;i<H;i++)for(let k=0;k<W;k++)if(!B[i][k]&&!(duck&&duck.r===i&&duck.c===k))opts.push([i,k]);
  if(opts.length){const[r,c]=opts[Math.floor(Math.random()*opts.length)];go(r,c)}
  else{duckPend=0;fin(false)}

  const hand=CAPT[turn],t=hand[0].t,dm=dropMoves(t);
  if(dm.length&&Math.random()<0.25){dropSel=t;mv=dm;const[r,c]=dm[Math.floor(Math.random()*dm.length)];doDrop(r,c);return}
 }
 if(!ms.length){status();render();return}
 const [a,b,r,c]=(S.ctl[turn]=='s'||S.ctl[turn]=='a'?botSmart():null)||ms[Math.floor(Math.random()*ms.length)];
 sel=[a,b];mv=[];

 if(pend)pick(bestPromo());
}

/* ========== АНАЛИЗАТОР ПАРТИЙ ========== */
let anMode=0,anData=[],anBusy=0,anCancel=0,anIdx=0;
/* пороги классификации (потеря в «сантипешках» относительно лучшего хода, с точки зрения ходавшего) */
const ANTH={brilliant:-80,best:15,good:40,inacc:90,mistake:180}; /* blunder > mistake */
const sqName=(r,c)=>(COLS_LETTERS[c]||'?')+(BH()-r);
function anBest(X,col,depth,timeMs){
 const real=ep;let root=[];
 X.forEach((row,r)=>row.forEach((p,c)=>{if(p&&p.c==col){
  legal(r,c,X).forEach(([i,k])=>{
   const Y=sim(X,r,c,i,k);if(!inCheck(Y,col))root.push([r,c,i,k,X[i][k]?(P[X[i][k].t].val||0):0]);
  });
 }}));
 if(!root.length){ep=real;return{score:inCheck(X,col)?-99000:0,move:null}}
 root.sort((a,b)=>b[4]-a[4]);
 let bestM=root[0],bestS=-1e9;T0=performance.now();TL=timeMs||180;
 try{
  for(let d=1;d<=depth;d++){
   let curBest=-1e9;const sc=[];
   for(const m of root){
    if(performance.now()-T0>TL)throw 'T';
    const[a,b,r,c]=m;ep=epOf(X[a][b],a,r,c);
    const v=-search(sim(X,a,b,r,c),nextTurn(col),d-1,-1e9,-(curBest-5),1,col);
    sc.push([m,v]);if(v>curBest){curBest=v;bestM=m;bestS=v}
   }
   sc.sort((x,y)=>y[1]-x[1]);root=sc.map(x=>x[0]).slice(0,Math.max(6,root.length));
   if(curBest>90000)break;
  }
 }catch(e){if(e!='T'){ep=real;throw e}}
 ep=real;
 return{score:bestS,move:bestM};
}
function classify(loss,isBest,scoreJump){
 /* scoreJump — изменение оценки с точки зрения ходившего (после − до) */
 if(isBest&&loss<=ANTH.best){
  /* Brilliant: лучший ход и сильный рост оценки (типичный «красивый» удар) */
  if(scoreJump>=120)return{tag:'!!',cls:'tag-!!',name:'Brilliant'};
  return{tag:'!',cls:'tag-!',name:'Best'};
 }
 if(loss<=ANTH.good)return{tag:'',cls:'tag-g',name:'Good'};
 if(loss<=ANTH.inacc)return{tag:'?!',cls:'tag-?!',name:'Inaccuracy'};
 if(loss<=ANTH.mistake)return{tag:'?',cls:'tag-?',name:'Mistake'};
 return{tag:'??',cls:'tag-??',name:'Blunder'};
}
function anMoveLabel(from,to,p,cap){
 if(!from||!to)return'—';
 const n=P[p&&p.t]?P[p.t].name[0]:'?';
 return(p&&!P[p.t].pw?n:'')+sqName(from[0],from[1])+(cap?'x':'-')+sqName(to[0],to[1]);
}
function runAnalysis(){
 if(anBusy||REC.length<2)return;
 anBusy=1;anCancel=0;anData=[];anIdx=0;anMode=1;
 const total=REC.length-1;
 const step=i=>{
  if(anCancel){anBusy=0;renderAn();return}
  if(i>=total){anBusy=0;anIdx=total;load(REC.length-1);renderAn();return}
  /* позиция до хода i (REC[i] — после хода) */
  const before=JSON.parse(REC[i]);
  const after=JSON.parse(REC[i+1]);
  const X=before.b,col=before.turn;
  const last=after.last; /* [[fr,fc],[tr,tc]] */
  const played=last?[last[0][0],last[0][1],last[1][0],last[1][1]]:null;
  const scoreBefore=evaluatePosition(X,'w');
  /* лёгкий поиск лучшего хода */
  const depth=total>40?1:(total>20?2:2);
  const tLim=total>40?80:(total>20?120:160);
  let best={score:0,move:null};
  try{best=anBest(X,col,depth,tLim)}catch(e){best={score:evalPos(X,col),move:null}}
  /* оценка сыгранного хода */
  let playedScore=-1e9,isBest=0;
  if(played){
   const[a,b,r,c]=played;
   const Y=sim(X,a,b,r,c);
   /* score after move from the mover's perspective ≈ -eval of opponent */
   playedScore=evalPos(Y,col);
   if(best.move&&best.move[0]==a&&best.move[1]==b&&best.move[2]==r&&best.move[3]==c)isBest=1;
   /* loss: how much worse than best (from mover's view) */
  }
  const bestScore=best.score;
  const loss=isBest?0:Math.max(0,bestScore-playedScore);
  const scoreAfter=evaluatePosition(after.b,'w');
  /* изменение оценки с точки зрения ходившего */
  const jump=col=='w'?(scoreAfter-scoreBefore):(scoreBefore-scoreAfter);
  const cl=classify(loss,isBest||loss<=ANTH.best,jump);
  const piece=played&&X[played[0]]?X[played[0]][played[1]]:null;
  const capBefore=before.cap||{w:[],b:[]},capAfter=after.cap||{w:[],b:[]};
  const cap=(capAfter.w.length>capBefore.w.length)||(capAfter.b.length>capBefore.b.length);
  anData.push({
   i:i+1,col,played,best:best.move,scoreBefore,scoreAfter,bestScore,playedScore,loss,cl,
   label:anMoveLabel(played&&[played[0],played[1]],played&&[played[2],played[3]],piece,cap),
   bestLabel:best.move&&X[best.move[0]]?anMoveLabel([best.move[0],best.move[1]],[best.move[2],best.move[3]],X[best.move[0]][best.move[1]],!!(X[best.move[2]]&&X[best.move[2]][best.move[3]])):'—'
  });
  anIdx=i+1;
  renderAn();
  setTimeout(()=>step(i+1),0);
 };
 /* восстановить текущую позицию после анализа не нужно — load управляет */
 step(0);
}

function drawGraph(canvas){
 if(!canvas||!anData.length)return;
 const ctx=canvas.getContext('2d'),W=canvas.width=canvas.clientWidth*2||600,H=canvas.height=120*2;
 ctx.scale(2,2);const w=W/2,h=H/2;
 const scores=anData.map(d=>d.scoreAfter/100); /* в пешках */
 const mn=Math.min(-2,...scores),mx=Math.max(2,...scores),rng=mx-mn||1;
 const y0=h*(1-(0-mn)/rng);
 ctx.clearRect(0,0,w,h);
 /* сетка */
 ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line')||'#ccc';
 ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(w,y0);ctx.stroke();
 /* линия */
 ctx.beginPath();
 scores.forEach((s,i)=>{
  const x=(i+.5)/scores.length*w,y=h*(1-(s-mn)/rng);
  i?ctx.lineTo(x,y):ctx.moveTo(x,y);
 });
 ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--acc')||'#2f5d8a';
 ctx.lineWidth=2;ctx.stroke();
 /* точки */
 scores.forEach((s,i)=>{
  const x=(i+.5)/scores.length*w,y=h*(1-(s-mn)/rng);
  ctx.beginPath();ctx.arc(x,y,anIdx===i+1?5:3,0,6.3);
  ctx.fillStyle=anIdx===i+1?'#f2a33a':(s>=0?'#2a8':'#c45');ctx.fill();
 });
 canvas.onclick=e=>{
  const rect=canvas.getBoundingClientRect();

 else if(a=='shareboard'){const b=S.boards[v];if(!b)return;const cus=Object.fromEntries(Object.keys(C).filter(k=>!STD[k]).map(k=>[k,C[k]]));const code='bd1:'+btoa(unescape(encodeURIComponent(JSON.stringify({board:b,C:cus}))));SHR=code;const ta=$('#bshr')||$('#shr');if(ta)ta.value=code;try{navigator.clipboard.writeText(code)}catch(e){}alert('Код доски скопирован (или в поле ниже)');return}
 else if(a=='applyrules'){save();alert('Правила применены к текущей игре');newG();return}
 else if(a=='impboard'){const raw=($('#bshr')?.value||$('#shr')?.value||'').trim();if(!raw){alert('Вставь код');return}try{
  if(raw.startsWith('bd1:')){const d=JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));const id='b'+Date.now().toString(36);const fid=(S.pf&&S.pf!=='std')?S.pf:'mine';S.boards[id]={...d.board,id,f:d.board&&d.board.f||fid};if(d.C){Object.assign(C,d.C);mkP()}S.curBoard=id;save();alert('Доска импортирована');render()}
  else alert('Нужен код доски (bd1:...)');
 }catch(x){alert('Ошибка чтения кода')}return}
 render()});
['input','change'].forEach(n=>document.addEventListener(n,e=>{
 const t=e.target;
 if(t.id=='fl'){if(t.files[0])up(t.files[0]);return}
 if(t.dataset&&t.dataset.sv){S.sv[t.dataset.sv]=t.value;save();playS(t.dataset.sv,t.value);return}
 if(t.dataset&&t.dataset.ui){S.ui=t.value;theme();save();return}
 if(t.dataset&&t.dataset.ai){S.ai[t.dataset.ai]=t.type=='checkbox'?(t.checked?1:0):(t.dataset.ai=='timeout'?+t.value:t.value);save();if(t.dataset.ai=='chat')updChat();return}
 if(t.dataset&&t.dataset.c){S[t.dataset.c]=t.value;theme();save();return}
 if(t.dataset&&t.dataset.fog){const k=t.dataset.fog;S.fog[k]=t.type=='checkbox'?(t.checked?1:0):+t.value;save();return}
 if(t.dataset&&t.dataset.rule){const k=t.dataset.rule;S.rules[k]=t.type=='checkbox'?(t.checked?1:0):(k==='checksToWin'?+t.value:t.value);save();return}
 if(t.dataset&&t.dataset.boardf){const bid=t.dataset.boardf;if(S.boards[bid]){S.boards[bid].f=t.value;save();render()}return}
 if(t.dataset&&t.dataset.bk&&boardEdit){const k=t.dataset.bk;boardEdit[k]=t.type==='checkbox'?(t.checked?1:0):((k==='players'||k==='w'||k==='h')?+t.value:t.value);return}
 if(t.dataset&&t.dataset.bkcol!=null&&boardEdit){boardEdit.colors[+t.dataset.bkcol]=t.value;return}
 if(t.dataset&&t.dataset.br&&boardEdit){const k=t.dataset.br;boardEdit.rules[k]=t.type==='checkbox'?(t.checked?1:0):(k==='checksToWin'?+t.value:t.value);return}
 if(t.dataset&&t.dataset.bf&&boardEdit){const k=t.dataset.bf;boardEdit.fog[k]=t.type==='checkbox'?(t.checked?1:0):+t.value;return}
 const k=t.dataset&&t.dataset.k;if(!k||!E)return;
 E[k]=t.type=='checkbox'?(t.checked?1:0):t.value;
 if(k=='do')$('#to').hidden=E.do!='to';
 if(k=='sep')$('#gh2').hidden=!E.sep}));

/* рисование: доска (расстановка) и пиксельный редактор */
let paint=0,lastSq='',lp=null,pp=0,lp2=null;
const seg=(l,x,y,f)=>{const n=l?Math.ceil(Math.hypot(x-l[0],y-l[1])/6):1;for(let i=1;i<=n;i++)f(l?l[0]+(x-l[0])*i/n:x,l?l[1]+(y-l[1])*i/n:y);return[x,y]};
const one=(x,y)=>{const t=document.elementFromPoint(x,y),s=t&&t.closest&&t.closest('.sq');if(!s)return;const k=s.dataset.r+'-'+s.dataset.c;if(k==lastSq)return;lastSq=k;const r=+s.dataset.r,c=+s.dataset.c;start[r][c]=tool?{t:tool,c:side}:null;const i=s.querySelector('.pc');if(i)i.remove();if(start[r][c])s.insertAdjacentHTML('afterbegin',pc(start[r][c]))};
const setPx=(k,i,ch)=>{E[k]=E[k].slice(0,i)+ch+E[k].slice(i+1);$('#px').children[i].style.background=ch=='.'?'':PAL[parseInt(ch,16)]};
const pxAt=(x,y)=>{const t=document.elementFromPoint(x,y);if(!t||!t.classList.contains('pxc'))return;const i=+t.dataset.i,k=E.es=='w'?'sw':'sb',X=i%16,Y=i>>4,pts=[[X,Y]];if(E.sy&1)pts.push([15-X,Y]);if(E.sy&2)pts.push(...pts.map(([a,b])=>[a,15-b]));pts.forEach(([a,b])=>setPx(k,b*16+a,E.col))};
$('#bd').addEventListener('pointerdown',e=>{if(tab!='setup')return;if(tool==='portal'||tool==='crystal')return;pushSH();paint=1;lastSq='';lp=seg(null,e.clientX,e.clientY,one);e.preventDefault()});
$('#bd').addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerdown',e=>{if(E&&e.target.classList&&e.target.classList.contains('pxc')){e.preventDefault();if(E.tl=='pen'){Ehist.push({sw:E.sw,sb:E.sb,es:E.es});pp=1;lp2=seg(null,e.clientX,e.clientY,pxAt)}else pxTool(+e.target.dataset.i)}});
document.addEventListener('pointermove',e=>{if(paint)lp=seg(lp,e.clientX,e.clientY,one);if(pp)lp2=seg(lp2,e.clientX,e.clientY,pxAt)});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{pp=0;if(paint){paint=0;save()}}));

/* загрузка сохранений: фигуры, доски, настройки — но партия всегда стартует с базовой 8×8 */
try{
 const s=JSON.parse(localStorage.getItem('cp3')||'{}');
 const keep=['l','d','snd','flip','duo','ctl','paused','ui','sv','fl','pf','ai','boards','positions'];
 if(s.S)keep.forEach(k=>{if(s.S[k]!=null)S[k]=s.S[k]});
 C=s.C||{};
}catch(e){}
ensureBoards();
S.ai={...AI_DEF,...(S.ai||{})};if(!S.ai.preset)S.ai.preset='zveno';if(S.ai.proxy==null)S.ai.proxy='';if(S.ai.hybrid==null)S.ai.hybrid=1;if(S.ai.vision==null)S.ai.vision=0;
S.bh=8;S.bw=8;S.players=2;S.curBoard='std';
S.rules={...DEF_RULES};S.fog={on:0,pass:0,radius:2,lines:1,diag:1,around:1,hidePieces:1,silhouettes:0,autoHide:1,delay:400};
S.checksCount={w:0,b:0};specials=[];
if(!S.ctl)S.ctl={w:'h',b:'h'};
S.ctl={w:S.ctl.w||'h',b:S.ctl.b||'h'}; /* на старте только 2 стороны */
side='w';tool='p';tab='play';
mkP();start=std();newG();
try{if(location.hash.startsWith('#g='))unpack(location.hash.slice(3))}catch(e){}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='chatin'){e.preventDefault();sendChat()}if(e.key=='Enter'&&e.target.id=='netchatin'){e.preventDefault();netChatSend(e.target.value);e.target.value=''}});
theme();render();
